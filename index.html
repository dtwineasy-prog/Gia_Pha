<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gia phả họ Nguyễn Đình</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="shortcut icon" type="image/png" href="favicon.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap">
  <style>
    :root {
      --bg: #FAF7F1;
      --red: #8C2F2F;
      --gold: #B98A3B;
      --ink: #22201D;
      --mute: #6B655D;
      --line: #E4DCCC;
      --ok: #2E7D4F;
      --warn: #B7791F;
      --err: #B3261E;
      --card: #fff;
      --tint: #F3ECDD;
      --serif: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
      --sans: 'Be Vietnam Pro', Inter, 'Noto Sans', system-ui, sans-serif
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.6 var(--sans);
      padding-bottom: 70px
    }

    h1,
    h2,
    h3 {
      font-family: var(--serif);
      font-weight: 700;
      line-height: 1.15;
      margin: 0 0 .5em;
      color: var(--red)
    }

    h1 {
      font-size: 34px
    }

    h2 {
      font-size: 26px
    }

    h3 {
      font-size: 20px
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer
    }

    a {
      color: var(--red)
    }

    :focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      border-bottom: 1px solid var(--line)
    }

    .hd {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 10px 16px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font: 700 21px var(--serif);
      color: var(--red);
      white-space: nowrap
    }

    .seal {
      width: 36px;
      height: 36px;
      background: var(--red);
      color: #F6E7C1;
      display: grid;
      place-items: center;
      border-radius: 4px;
      font: 700 20px var(--serif)
    }

    .sbox {
      position: relative;
      flex: 1;
      max-width: 420px;
      margin-left: auto
    }

    .sbox input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: #fff
    }

    .sug {
      position: absolute;
      left: 0;
      right: 0;
      top: 46px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 8px 24px #0002;
      max-height: 70vh;
      overflow: auto
    }

    .sug button {
      display: flex;
      gap: 10px;
      align-items: center;
      width: 100%;
      text-align: left;
      border: 0;
      background: none;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line)
    }

    .sug small,
    .mut {
      color: var(--mute)
    }

    small {
      font-size: 14px
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid var(--line);
      display: flex;
      z-index: 20;
      overflow-x: auto
    }

    nav a {
      flex: 1;
      min-width: 64px;
      text-align: center;
      padding: 8px 4px;
      font-size: 13px;
      text-decoration: none;
      color: var(--mute);
      border-top: 3px solid transparent
    }

    nav a.on {
      color: var(--red);
      border-top-color: var(--red);
      font-weight: 600
    }

    nav a b {
      display: block;
      font-size: 19px;
      font-weight: 400
    }

    .role {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px;
      background: #fff;
      max-width: 110px
    }

    .btn {
      display: inline-block;
      border: 1px solid var(--red);
      background: var(--red);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500
    }

    .btn.alt {
      background: none;
      color: var(--red)
    }

    .btn.sm {
      padding: 6px 12px;
      font-size: 14px
    }

    .btn.dng {
      background: var(--err);
      border-color: var(--err)
    }

    .btn:disabled {
      opacity: .5
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px
    }

    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr
    }

    .av {
      flex: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #F2D9D2;
      color: var(--red);
      font: 700 17px var(--serif);
      border: 2px solid var(--gold)
    }

    .av.f {
      background: #EFE3C4;
      color: #7A5B1E
    }

    .av.x {
      background: #ECE8E0;
      color: var(--mute);
      border-color: var(--line)
    }

    .av.lg {
      width: 96px;
      height: 96px;
      font-size: 34px
    }

    .pc {
      display: flex;
      gap: 12px;
      align-items: center;
      text-align: left;
      width: 100%;
      cursor: pointer
    }

    .chip {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 14px;
      background: var(--tint);
      font-size: 13px;
      margin: 2px 4px 2px 0;
      border: 1px solid var(--line)
    }

    .chip.on {
      background: var(--red);
      color: #fff;
      border-color: var(--red)
    }

    .hero {
      display: grid;
      gap: 20px;
      padding: 28px 16px;
      background: linear-gradient(var(--tint), var(--bg));
      border-bottom: 1px solid var(--line)
    }

    .hero .in {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      gap: 24px;
      width: 100%
    }

    .chain {
      list-style: none;
      margin: 0;
      padding: 0 0 0 14px;
      border-left: 2px solid var(--gold)
    }

    .chain li {
      position: relative;
      padding: 4px 0 4px 16px
    }

    .chain li::before {
      content: '';
      position: absolute;
      left: -22px;
      top: 14px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--gold)
    }

    .chain li.me::before {
      background: var(--red);
      box-shadow: 0 0 0 4px #8C2F2F33
    }

    .chain b {
      font-family: var(--serif);
      font-size: 19px
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px
    }

    .stats div {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 14px
    }

    .stats b {
      font: 700 28px var(--serif);
      color: var(--red);
      display: block;
      line-height: 1.1
    }

    .tree {
      overflow: auto;
      padding: 24px 10px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      min-height: 320px;
      cursor: grab;
      touch-action: pan-x pan-y pinch-zoom
    }

    .tz {
      display: inline-flex;
      min-width: 100%;
      justify-content: center;
      transform-origin: top center;
      transition: transform .15s
    }

    .br {
      display: flex;
      flex-direction: column;
      align-items: center
    }

    .ps {
      display: flex;
      gap: 14px;
      align-items: flex-end
    }

    .ps>.br {
      position: relative;
      padding-bottom: 16px
    }

    .ps>.br::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      height: 16px;
      border-left: 2px solid var(--gold)
    }

    .ps>.br::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      border-top: 2px solid var(--gold)
    }

    .ps>.br:first-child::after {
      left: 50%
    }

    .ps>.br:last-child::after {
      right: 50%
    }

    .st {
      height: 16px;
      border-left: 2px solid var(--gold)
    }

    .nd {
      width: 116px;
      text-align: center;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 4px;
      display: block;
      font-size: 14px;
      line-height: 1.3
    }

    .nd .av {
      margin: 0 auto 4px
    }

    .nd.me {
      border: 2px solid var(--red);
      background: #FBEFEA
    }

    .nd.vr {
      border-style: dashed;
      color: var(--mute);
      background: var(--bg)
    }

    .nd small {
      display: block;
      color: var(--mute);
      font-size: 12px
    }

    .sheet {
      position: fixed;
      z-index: 30;
      background: #fff;
      box-shadow: 0 -8px 30px #0003;
      padding: 18px;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 18px 18px 0 0;
      max-height: 70vh;
      overflow: auto;
      animation: up .2s
    }

    @keyframes up {
      from {
        transform: translateY(40px);
        opacity: 0
      }
    }

    .tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
      margin: 16px 0
    }

    .tabs button {
      border: 0;
      background: none;
      padding: 10px 14px;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
      color: var(--mute)
    }

    .tabs button.on {
      color: var(--red);
      border-color: var(--red);
      font-weight: 600
    }

    dl {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 8px 12px;
      margin: 0
    }

    dt {
      color: var(--mute)
    }

    dd {
      margin: 0
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px
    }

    td,
    th {
      padding: 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top
    }

    .tw {
      overflow-x: auto
    }

    input,
    select,
    textarea {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 12px;
      background: #fff;
      width: 100%
    }

    label {
      display: block;
      font-size: 14px;
      color: var(--mute);
      margin-top: 10px
    }

    .fg {
      display: grid;
      gap: 0 12px;
      grid-template-columns: 1fr
    }

    .mask {
      position: fixed;
      inset: 0;
      background: #0006;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 12px
    }

    .modal {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      max-width: 560px;
      width: 100%;
      max-height: 90vh;
      overflow: auto
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 84px;
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 10px 18px;
      border-radius: 24px;
      z-index: 50
    }

    .empty {
      text-align: center;
      padding: 36px 12px;
      color: var(--mute)
    }

    .gen {
      display: flex;
      gap: 12px;
      align-items: center;
      width: 100%;
      text-align: left
    }

    .gen .n {
      font: 700 30px var(--serif);
      color: var(--gold);
      width: 44px
    }

    .ev {
      display: flex;
      gap: 14px;
      align-items: center
    }

    .ev .d {
      flex: none;
      width: 58px;
      text-align: center;
      background: var(--red);
      color: #fff;
      border-radius: 8px;
      padding: 4px;
      font: 700 22px/1.1 var(--serif)
    }

    .ev .d small {
      display: block;
      font: 12px var(--sans)
    }

    .ph {
      aspect-ratio: 1;
      border-radius: 10px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 8px;
      font-size: 13px;
      color: #fff
    }

    .ban {
      background: #FFF6E0;
      border: 1px solid var(--warn);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 14px
    }

    .ok {
      color: var(--ok)
    }

    .er {
      color: var(--err)
    }

    @media(min-width:768px) {
      h1 {
        font-size: 44px
      }

      h2 {
        font-size: 30px
      }

      .grid {
        grid-template-columns: 1fr 1fr
      }

      .fg {
        grid-template-columns: 1fr 1fr
      }

      .hero .in {
        grid-template-columns: 1.2fr 1fr;
        align-items: center
      }

      .stats {
        grid-template-columns: repeat(4, 1fr)
      }

      .hero {
        padding: 48px 16px
      }
    }

    @media(min-width:1024px) {
      body {
        padding-bottom: 0
      }

      nav {
        position: static;
        border: 0;
        background: none;
        max-width: 1100px;
        margin: 0 auto;
        overflow: visible
      }

      nav a {
        flex: none;
        padding: 8px 14px;
        border-top: 0;
        border-bottom: 3px solid transparent
      }

      nav a.on {
        border-bottom-color: var(--red)
      }

      nav a b {
        display: none
      }

      .grid {
        grid-template-columns: repeat(3, 1fr)
      }

      .sheet {
        left: auto;
        top: 70px;
        bottom: 0;
        width: 360px;
        border-radius: 0;
        max-height: none;
        box-shadow: -6px 0 24px #0002
      }

      .toast {
        bottom: 24px
      }

      header {
        padding-bottom: 0
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }

    body:not(.in) .sbox,
    body:not(.in) #who,
    body:not(.in) #out {
      display: none
    }

    @media(max-width:767px) {
      #who {
        display: none
      }
    }

    .tz {
      display: block;
      min-width: max-content;
      transform-origin: 0 0
    }

    .gt {
      position: relative;
      display: block;
      min-width: max-content
    }

    .gr {
      margin-bottom: 64px;
      padding: 8px 12px 14px;
      border-radius: 12px;
      background: var(--tint)
    }

    .gr:last-child {
      margin-bottom: 0
    }

    .gl {
      position: sticky;
      left: 8px;
      width: max-content;
      font: 700 18px var(--serif);
      color: var(--red);
      padding-bottom: 6px
    }

    .gl .chip {
      margin-left: 8px;
      font: 500 13px var(--sans);
      background: #fff;
      color: var(--ink)
    }

    .gn {
      display: flex;
      gap: 16px;
      justify-content: center
    }

    svg.ln {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
      z-index: 2;
      overflow: visible
    }

    .ln path {
      fill: none
    }

    .lf {
      stroke: var(--gold);
      stroke-width: 2
    }

    .lm {
      stroke: var(--red);
      stroke-width: 1.5;
      stroke-dasharray: 5 4;
      opacity: .7
    }

    .cb {
      position: relative
    }

    .cbl {
      position: absolute;
      z-index: 60;
      left: 0;
      right: 0;
      top: 100%;
      margin-top: 4px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      max-height: 220px;
      overflow: auto;
      box-shadow: 0 8px 24px #0003
    }

    .cbo {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: none;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line)
    }

    .cbo:hover,
    .cbo.act {
      background: var(--tint)
    }

    .cbo small {
      display: block
    }

    .gt .nd {
      position: absolute;
      z-index: 2;
      height: 148px;
      overflow: hidden;
      border-top: 4px solid var(--fc, var(--line));
      transition: opacity .25s, box-shadow .25s, transform .25s
    }

    .gt .nd.me {
      border-top-color: var(--red)
    }

    .gb {
      position: absolute;
      left: 0;
      right: 0;
      background: var(--tint);
      border-radius: 12px
    }

    .gl {
      z-index: 3;
      background: var(--tint);
      padding: 6px 10px 0;
      border-radius: 10px
    }

    svg.ln {
      z-index: 1
    }

    .ln .e {
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: opacity .25s
    }

    .ln .wf {
      fill: none;
      stroke: #fff;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 6 14;
      display: none
    }

    .ln .mar {
      stroke: var(--gold);
      stroke-width: 3
    }

    .hl .nd:not(.on) {
      opacity: .22;
      filter: grayscale(.7)
    }

    .hl .e:not(.a) {
      opacity: .08
    }

    .hl .dt,
    .hl .mar {
      opacity: .2
    }

    .hl .e.a {
      stroke-width: 5;
      opacity: 1
    }

    .hl .e.an {
      stroke: var(--red)
    }

    .hl .e.de {
      stroke: var(--ok)
    }

    .hl .wf.a {
      display: block;
      stroke-width: 3;
      animation: flow 1s linear infinite
    }

    .nd.an {
      box-shadow: 0 0 0 3px var(--red)
    }

    .nd.de {
      box-shadow: 0 0 0 3px var(--ok)
    }

    .nd.sb {
      box-shadow: 0 0 0 2px var(--gold)
    }

    .nd.sl {
      box-shadow: 0 0 0 4px #E2A93B, 0 8px 20px #0004;
      transform: scale(1.05);
      z-index: 4
    }

    @keyframes flow {
      to {
        stroke-dashoffset: -20
      }
    }

    .tz {
      min-width: 0;
      transform: none
    }

    .zc {
      position: fixed;
      left: 14px;
      bottom: 76px;
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 6px;
      box-shadow: 0 6px 20px #0003
    }

    .zc .btn {
      width: 40px;
      height: 40px;
      padding: 0;
      font-size: 20px
    }

    .zc span {
      font-size: 12px;
      color: var(--mute)
    }

    @media(min-width:1024px) {
      .zc {
        bottom: 24px;
        left: 24px
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="hd">
      <a class="brand" href="#/home"><span class="seal">Ng</span><span>Họ Nguyễn Đình</span></a>
      <div class="sbox"><input id="q" type="search" placeholder="Tìm tên, nơi ở, năm sinh…" autocomplete="off"
          aria-label="Tìm kiếm">
        <div id="sug" class="sug" hidden></div>
      </div>
      <span id="who" class="chip"></span><button id="out" class="btn sm alt" onclick="logout()">Đăng xuất</button>
    </div>
    <nav id="nav"></nav>
  </header>
  <main id="app"></main>
  <div id="ov"></div>
  <script>
    /* ===== CẤU HÌNH SUPABASE: điền 2 giá trị này (Project Settings > API) ===== */
    const SUPABASE_URL = 'https://grdebmsoqpyogzuxjgwt.supabase.co', SUPABASE_KEY = 'sb_publishable_sGgwfxX4y89rUGU13NxEug_g6sDodQG';
    const NEEDPW = /type=(invite|recovery)/.test(location.hash);
    /* ===== DỮ LIỆU MẪU (chỉ dùng cho nút Nạp dữ liệu mẫu) ===== */
    const KEY = 'giapha-demo-v2';
    const SEED = [

 <div class="wrap">${!P(S.me) || (P(S.me).bio || '').length > 10 ? '' : '<div class="ban">Hồ sơ của bạn còn thiếu thông tin. <a href="#/person/' + S.me + '">Bổ sung hồ sơ của bạn</a></div>'}
 <div class="stats"><div><b>${live().length}</b>thành viên</div><div><b>${gens}</b>thế hệ</div><div><b>${live().filter(p => p.gr).length}</b>phần mộ có tọa độ</div><div><b>${evAll().filter(e => e[1] >= todayS()).length}</b>sự kiện sắp tới</div></div>
 <h2 style="margin-top:28px">Sự kiện sắp tới</h2><div class="grid">${ev.map(evCard).join('')}</div>

    function evCard(e) {const [y, m, d] = e[1].split('-').map(Number); return `<div class="card ev"><div class="d">${d}<small>Tháng ${m}</small></div><div><b>${esc(e[0])}</b><br><small class="mut">${d}/${m}/${y}${e[2] ? ' · ' + esc(e[2]) : ''}</small>${e[5] ? `<br><small>${esc(e[5])}</small>` : ''}<br><span class="chip">${e[3]}</span></div></div>`}

    /* ===== CÂY GIA PHẢ: mỗi thế hệ nằm trên một hàng ===== */
    const FW = 116, FH = 148, CG = 22, SG = 18, RH = 270, TOP = 38;
    const famCol = i => `hsl(${Math.round(i * 137.508) % 360} ${[62, 70, 58][i % 3]}% ${[40, 34, 46][i % 3]}%)`;
    function node(p, cls = '', st = '') {return `<button class="nd ${cls}" data-id="${p.id}" style="${st}" onclick="openSheet(${p.id});hl(${p.id})" aria-label="${esc(p.name)}">${av(p)}<b>${esc(p.name.split(' ').slice(-2).join(' '))}</b><small>${life(p)}</small>${relTo(p.id) && p.id !== S.me ? `<small>${relTo(p.id)}</small>` : ''}</button>`}
    /* Bố cục: con nằm ngay dưới cha mẹ (cha mẹ căn giữa trên đàn con); mỗi thế hệ cùng một hàng; mỗi gia đình một màu (góc vàng nên không giới hạn số màu) */
    function layout(ids) {
      const inS = new Set(ids.map(p => p.id)), U = {}, us = [], pos = {}, gOf = {};
      [...ids].sort((a, b) => a.gen - b.gen || a.b - b.b || a.id - b.id).forEach(p => {if (U[p.id]) return; const u = {m: [p], k: []}; U[p.id] = u; us.push(u); const s = P(p.sp); if (s && inS.has(s.id) && !U[s.id]) {u.m.push(s); U[s.id] = u} });
      us.forEach(u => {u.m.sort((a, b) => (a.g === 'F') - (b.g === 'F')); for (const x of u.m) {const par = [x.f, x.m].find(y => y && inS.has(y) && U[y] !== u); if (par) {u.pu = U[par]; u.lin = x; break} } if (u.pu) u.pu.k.push(u)});
      us.forEach(u => {u.k.sort((a, b) => a.lin.b - b.lin.b || a.lin.id - b.lin.id); u.gen = (u.lin || u.m[0]).gen});
      let ci = 0; us.forEach(u => {if (u.k.length) u.col = famCol(ci++)});
      const gens = [...new Set(us.map(u => u.gen))].sort((x, y) => x - y), ri = {}; gens.forEach((g, i) => ri[g] = i);
      const uw = u => u.m.length * FW + (u.m.length - 1) * CG, ks = u => u.k.reduce((t, k) => t + k.sw, 0) + Math.max(0, u.k.length - 1) * SG;
      const sw = u => {u.k.forEach(sw); u.sw = Math.max(uw(u), ks(u))};
      const place = (u, l) => {let c = l + (u.sw - ks(u)) / 2; u.k.forEach(k => {place(k, c); c += k.sw + SG}); u.x = l + (u.sw - uw(u)) / 2; u.m.forEach((m, i) => {pos[m.id] = [u.x + i * (FW + CG), ri[u.gen] * RH + TOP]; gOf[m.id] = u.gen})};
      let X = 12; us.filter(u => !u.pu).forEach(u => {sw(u); place(u, X); X += u.sw + SG * 3});
      return {pos, us, gens, gOf, W: Math.max(X - SG * 2, 200), H: gens.length * RH - (RH - TOP - FH - 14)}
    }
    function tree(a) {
      const all = live(); if (!all.length) return `<div class="wrap">${empty('Chưa có dữ liệu để dựng cây.')}</div>`;
      const anc = a && P(+a); if (anc) S.center = +a; const c = P(S.center) || P(S.me) || all[0]; S.center = c.id; S.sel = 0;
      let ids = all; if (anc) {const set = new Set([c.id]); let lv = [c.id]; for (let d = 0; d < 6 && lv.length; d++) {lv = lv.flatMap(x => {const p = P(x); return p ? [p.f, p.m].filter(y => y && P(y) && !set.has(y)) : []}); lv.forEach(y => set.add(y))} ids = all.filter(p => set.has(p.id))}
      S.vis = ids; const L = layout(ids), rowN = {}; L.us.forEach(u => {if (L.pos[u.m[0].id]) rowN[u.gen] = (rowN[u.gen] || 0) + u.m.length});
      const tot = g => all.filter(p => (L.gOf[p.id] ?? p.gen) === g).length; let sv = '';
      L.us.forEach(u => {
        if (!L.pos[u.m[0].id]) return; const y0 = L.pos[u.m[0].id][1]; if (u.m.length > 1) sv += `<path class="mar" d="M${u.x + FW} ${y0 + FH / 2}H${u.x + FW + CG}"/>`; if (!u.k.length) return;
        const two = u.m.length > 1, ax = two ? u.x + FW + CG / 2 : u.x + FW / 2, ay = two ? y0 + FH / 2 : y0 + FH, by = y0 + FH + 49;
        u.k.forEach(k => {const p = L.pos[k.lin.id], d = `M${ax} ${ay}V${by}H${p[0] + FW / 2}V${p[1]}`; sv += `<path class="e" data-c="${k.lin.id}" stroke="${u.col}" d="${d}"/><path class="wf" data-c="${k.lin.id}" d="${d}"/>`}); sv += `<circle class="dt" cx="${ax}" cy="${ay}" r="5" fill="${u.col}"/>`
      });
      const bands = L.gens.map((g, i) => `<div class="gb" style="top:${i * RH}px;height:${TOP + FH + 14}px"><div class="gl">Đời ${g}<span class="chip">${rowN[g] || 0} người${anc && rowN[g] !== tot(g) ? ' / ' + tot(g) + ' trong dòng họ' : ''}</span></div></div>`).join('');
      const nodes = L.us.flatMap(u => u.m.map(m => L.pos[m.id] ? node(m, m.id === c.id ? 'me' : '', `left:${L.pos[m.id][0]}px;top:${L.pos[m.id][1]}px;${u.pu && u.lin === m ? '--fc:' + u.pu.col : ''}`) : '')).join('');

 <div class="tabs" role="tablist"><button role="tab" class="${anc ? '' : 'on'}" onclick="location.hash='#/tree'">Toàn bộ dòng họ</button><button role="tab" class="${anc ? 'on' : ''}" onclick="location.hash='#/tree/${c.id}'">Tổ tiên của ${esc(c.name)}</button></div>
 <div class="row" style="margin-bottom:12px">${anc ? `<span style="max-width:220px"><select onchange="location.hash='#/tree/'+this.value" aria-label="Đổi người trung tâm">${all.map(p => `<option value="${p.id}" ${p.id === c.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></span>` : ''}<small class="mut">Mỗi gia đình một màu: đường kẻ và vạch trên thẻ con cùng màu với cha mẹ. Bấm vào một người để xem dòng liên kết.</small></div>
 <div class="zc" role="group" aria-label="Thu phóng cây"><button class="btn sm" onclick="zoom(.15)" aria-label="Phóng to">＋</button><span id="zl">100%</span><button class="btn sm" onclick="zoom(-.15)" aria-label="Thu nhỏ">－</button><button class="btn sm alt" onclick="fitTree()" title="Vừa khít chiều ngang" aria-label="Vừa khít chiều ngang">⤢</button></div><div id="hlbar" class="ban" hidden></div>

    function relSets(id) {
      const A = new Set(), D = new Set(), SB = new Set(), inS = new Set(S.vis.map(p => p.id)), p = P(id);
      const up = x => [x.f, x.m].forEach(y => {const q = y && inS.has(y) && P(y); if (q && !A.has(y)) {A.add(y); up(q)} }), dn = x => kids(x.id).forEach(k => {if (inS.has(k.id) && !D.has(k.id)) {D.add(k.id); dn(k)} }); up(p); dn(p);
      if (inS.has(p.sp)) SB.add(p.sp); live().forEach(q => {if (q.id !== id && inS.has(q.id) && ((p.f && q.f === p.f) || (p.m && q.m === p.m))) SB.add(q.id)}); D.forEach(i => {const s = P(i).sp; if (s && inS.has(s)) SB.add(s)}); return {A, D, SB}

    function hl(id) {

    function clearHl() {S.sel = 0; const g = $('#gt'); if (g) {g.classList.remove('hl'); g.querySelectorAll('.nd,.e,.wf').forEach(x => x.classList.remove('an', 'de', 'sb', 'on', 'sl', 'a'))} const b = $('#hlbar'); if (b) b.hidden = true; closeSheet()}
    function initTree() {
      const t = $('#tr'); if (!t) return; S.zoom = Math.max(.3, Math.min(1, (t.clientWidth - 16) / +$('#gt').dataset.w)); zoom(0); const n = $('.nd.me'); if (n) t.scrollLeft = Math.max(0, (n.offsetLeft + FW / 2) * S.zoom - t.clientWidth / 2);
      if (!window._esc) {window._esc = 1; document.addEventListener('keydown', e => {if (e.key === 'Escape') clearHl()})}

      let dn = 0, sx, sl, mv = 0; t.addEventListener('pointerdown', e => {mv = 0; if (e.target.closest('.nd')) return; dn = 1; sx = e.clientX; sl = t.scrollLeft}); window.addEventListener('pointermove', e => {if (dn) {mv = Math.abs(e.clientX - sx); t.scrollLeft = sl - (e.clientX - sx)} }); window.addEventListener('pointerup', () => dn = 0);

    function zoom(d) {const t = $('#tr'), g = $('#gt'), z = $('#tz'); if (!g) return; const o = S.zoom, cx = t ? (t.scrollLeft + t.clientWidth / 2) / o : 0; S.zoom = Math.min(1.6, Math.max(.3, o + d)); g.style.transformOrigin = '0 0'; g.style.transform = `scale(${S.zoom})`; z.style.width = +g.dataset.w * S.zoom + 'px'; z.style.height = parseFloat(g.style.height) * S.zoom + 'px'; const l = $('#zl'); if (l) l.textContent = Math.round(S.zoom * 100) + '%'; if (d && t) t.scrollLeft = cx * S.zoom - t.clientWidth / 2}

          }
        });
        S.imp = {ok: cand, err, warn, lk, upd}; render()
      }; rd.readAsText(f, 'utf-8')
    }
    async function doImp() {
      const {ok} = S.imp, res = mkRes(ok), Dm = {}; ppl.forEach(p => {if (p.ext) Dm[p.ext.trim().toLowerCase()] = p});
      const G = new Map(), gOf = q => q ? (q.o ? G.get(q.o) : q.p.gen) : 0; ok.forEach(o => {const n = +o.generation_number; if (n > 0) G.set(o, n)});
      for (let i = 0; i < 8; i++)ok.forEach(o => {if (G.has(o)) return; for (const k of ['father_external_id', 'mother_external_id']) {const g = gOf(res(o[k])); if (g) {G.set(o, g + 1); return } } const g = gOf(res(o.spouse_external_id)); if (g) G.set(o, g)});
      const body = o => ({name: o.full_name, g: o.gender && /^(F|FEMALE|NU|NỮ)$/i.test(o.gender) ? 'F' : 'M', bd: o.birth_date || null, dd: o.death_date || null, pl: o.birth_place || null, job: o.occupation || null, gen: G.get(o) || 1}), ID = new Map(), errs = [];
      const old = ok.filter(o => o.external_id && Dm[o.external_id.toLowerCase()]), nw = ok.filter(o => !old.includes(o));
      old.forEach(o => ID.set(o, Dm[o.external_id.toLowerCase()].id));
      if (nw.length) {const r = await sb.from('persons').insert(nw.map(o => ({...body(o), ext: o.external_id || null}))).select(); if (r.error) return fail(r.error); if (r.data.length !== nw.length) return toast('Lỗi: số dòng trả về không khớp'); nw.forEach((o, i) => ID.set(o, r.data[i].id))}
      const U = {}, put = (id, k, v) => (U[id] = U[id] || {})[k] = v, cnt = {f: 0, m: 0, sp: 0};
      old.forEach(o => put(ID.get(o), '__body', body(o)));
      ok.forEach(o => {const me = ID.get(o); for (const [k, t, l] of LK) {const q = res(o[k]); const id = q ? (q.o ? ID.get(q.o) : q.p.id) : 0; if (!id || id === me) continue; put(me, l, id); cnt[l]++; if (l === 'sp') put(id, 'sp', me)} });
      const jobs = Object.entries(U).map(([id, u]) => async () => {const {__body, ...lk} = u, r = await sb.from('persons').update({...(__body || {}), ...lk}).eq('id', +id); if (r.error) errs.push(r.error.message)});
      for (let i = 0; i < jobs.length; i += 10)await Promise.all(jobs.slice(i, i + 10).map(j => j()));
      const sum = `${nw.length} mới, ${old.length} cập nhật; liên kết ${cnt.f} cha, ${cnt.m} mẹ, ${cnt.sp} vợ/chồng`;
      await log('IMPORT', 'CSV', sum + (errs.length ? `; ${errs.length} lỗi cập nhật` : '')); await loadAll(); S.imp = null; S.atab = 'log'; render(); toast(errs.length ? 'Có lỗi khi liên kết: ' + errs[0] : 'Đã nhập: ' + sum)
    }
    async function seedSample() {
      const rows = SEED.map(r => ({name: r[1], cn: r[2], g: r[3], bd: DATES[r[0]][0] || null, dd: DATES[r[0]][1] || null, pl: r[6], job: r[7], gen: r[8], bio: r[12], gr: r[13] || null, ext: 'S' + r[0]}));
      const r = await sb.from('persons').insert(rows).select(); if (r.error) return fail(r.error); const id = {}; r.data.forEach(x => id[x.ext] = x.id);
      for (const e of SEED) {const u = {}; if (e[9]) u.f = id['S' + e[9]]; if (e[10]) u.m = id['S' + e[10]]; if (e[11]) u.sp = id['S' + e[11]]; if (Object.keys(u).length) await sb.from('persons').update(u).eq('id', id['S' + e[0]])}
      await log('IMPORT', 'Dữ liệu mẫu', 'Nạp 18 người mẫu'); await loadAll(); S.me = id.S14 || S.me; S.center = S.me; toast('Đã nạp dữ liệu mẫu'); render()
    }
    /* ===== ĐĂNG NHẬP & TẢI DỮ LIỆU ===== */
    let sb;
    async function boot() {
      if (/XXXX|ANON_PUBLIC/.test(SUPABASE_URL + SUPABASE_KEY) || !window.supabase) return $('#app').innerHTML = '<div class="wrap"><div class="ban">Chưa cấu hình. Mở file, điền SUPABASE_URL và SUPABASE_KEY ở đầu thẻ script.</div></div>';
      sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); const {data} = await sb.auth.getSession(); data.session ? start(data.session.user) : showLogin()
    }
    function showLogin(msg = '') {$('#nav').innerHTML = ''; $('#app').innerHTML = `<div class="wrap" style="max-width:420px;padding-top:40px"><div class="card"><h2>Đăng nhập</h2><p class="mut">Gia phả chỉ dành cho thành viên đã được cấp tài khoản.</p><label for="le">Email</label><input id="le" type="email" autocomplete="username"><label for="lp">Mật khẩu</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><p id="lerr" class="er" role="alert">${msg}</p><div class="row"><button class="btn" onclick="doLogin()">Đăng nhập</button><button class="btn alt" onclick="forgot()">Quên mật khẩu</button></div></div></div>`}
    async function doLogin() {const r = await sb.auth.signInWithPassword({email: $('#le').value.trim(), password: $('#lp').value}); if (r.error) return $('#lerr').textContent = 'Email hoặc mật khẩu không đúng.'; start(r.data.user)}
    async function forgot() {const e = $('#le').value.trim(); if (!e) return $('#lerr').textContent = 'Nhập email trước.'; await sb.auth.resetPasswordForEmail(e, {redirectTo: location.origin + location.pathname}); toast('Nếu email tồn tại, liên kết đặt lại mật khẩu đã được gửi')}
    async function logout() {await sb.auth.signOut(); location.hash = ''; location.reload()}
    function newPw() {modal('<h3>Đặt mật khẩu mới</h3><label for="np">Mật khẩu (tối thiểu 8 ký tự)</label><input id="np" type="password" autocomplete="new-password"><div class="row" style="margin-top:14px"><button class="btn" onclick="setPw()">Lưu mật khẩu</button></div>')}
    async function setPw() {const p = $('#np').value; if (p.length < 8) return toast('Mật khẩu cần ít nhất 8 ký tự'); const r = await sb.auth.updateUser({password: p}); if (r.error) return fail(r.error); closeM(); toast('Đã đặt mật khẩu')}
    async function loadAll() {
      const r = await sb.from('persons').select('*').order('id').range(0, 4999); if (r.error) return fail(r.error); ppl = r.data.map(fromDb);
      if (S.role === 'ADMIN') {
        const u = await sb.from('profiles').select('*').order('email'); USERS = (u.data || []).map(x => [x.email, x.full_name || '', x.role, 'ACTIVE', x.id]); const nm = Object.fromEntries(USERS.map(x => [x[4], x[1] || x[0]]));
        const a = await sb.from('audit_log').select('*').order('at', {ascending: false}).limit(100); audit = (a.data || []).map(x => ({t: new Date(x.at).toLocaleString('vi-VN'), who: nm[x.who] || '?', act: x.act, ent: x.ent, txt: x.txt, pid: x.pid || 0}))
      } else audit = []
    }
    async function start(u) {
      const pr = await sb.from('profiles').select('*').eq('id', u.id).maybeSingle(), pf = pr.data;
      if (!pf) {$('#nav').innerHTML = ''; $('#app').innerHTML = '<div class="wrap">' + empty('Tài khoản của bạn chưa được cấp quyền. Vui lòng liên hệ quản trị viên.', '<button class="btn alt" onclick="logout()">Đăng xuất</button>') + '</div>'; return }
      S.role = pf.role; $('#who').textContent = (pf.full_name || u.email) + ' · ' + pf.role; await loadAll(); S.me = pf.person_id || live()[0]?.id || 0; S.center = S.me;
      document.body.classList.add('in'); S.ready = 1; if (!location.hash) location.hash = '#/home'; render(); if (NEEDPW) newPw()
    }
    boot();
  </script>
