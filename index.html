<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gia phả họ Nguyễn Đình</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap">
  <style>
    :root {
      --bg: #FAF7F1;
      --red: #8C2F2F;
      --gold: #B98A3B;
      --ink: #22201D;
      --mute: #6B655D;
      --line: #E4DCCC;
      --ok: #2E7D4F;
      --warn: #B7791F;
      --err: #B3261E;
      --card: #fff;
      --tint: #F3ECDD;
      --serif: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
      --sans: 'Be Vietnam Pro', Inter, 'Noto Sans', system-ui, sans-serif
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.6 var(--sans);
      padding-bottom: 70px
    }

    h1,
    h2,
    h3 {
      font-family: var(--serif);
      font-weight: 700;
      line-height: 1.15;
      margin: 0 0 .5em;
      color: var(--red)
    }

    h1 {
      font-size: 34px
    }

    h2 {
      font-size: 26px
    }

    h3 {
      font-size: 20px
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer
    }

    a {
      color: var(--red)
    }

    :focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      border-bottom: 1px solid var(--line)
    }

    .hd {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 10px 16px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font: 700 21px var(--serif);
      color: var(--red);
      white-space: nowrap
    }

    .seal {
      width: 36px;
      height: 36px;
      background: var(--red);
      color: #F6E7C1;
      display: grid;
      place-items: center;
      border-radius: 4px;
      font: 700 20px var(--serif)
    }

    .sbox {
      position: relative;
      flex: 1;
      max-width: 420px;
      margin-left: auto
    }

    .sbox input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: #fff
    }

    .sug {
      position: absolute;
      left: 0;
      right: 0;
      top: 46px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 8px 24px #0002;
      max-height: 70vh;
      overflow: auto
    }

    .sug button {
      display: flex;
      gap: 10px;
      align-items: center;
      width: 100%;
      text-align: left;
      border: 0;
      background: none;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line)
    }

    .sug small,
    .mut {
      color: var(--mute)
    }

    small {
      font-size: 14px
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid var(--line);
      display: flex;
      z-index: 20;
      overflow-x: auto
    }

    nav a {
      flex: 1;
      min-width: 64px;
      text-align: center;
      padding: 8px 4px;
      font-size: 13px;
      text-decoration: none;
      color: var(--mute);
      border-top: 3px solid transparent
    }

    nav a.on {
      color: var(--red);
      border-top-color: var(--red);
      font-weight: 600
    }

    nav a b {
      display: block;
      font-size: 19px;
      font-weight: 400
    }

    .role {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px;
      background: #fff;
      max-width: 110px
    }

    .btn {
      display: inline-block;
      border: 1px solid var(--red);
      background: var(--red);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500
    }

    .btn.alt {
      background: none;
      color: var(--red)
    }

    .btn.sm {
      padding: 6px 12px;
      font-size: 14px
    }

    .btn.dng {
      background: var(--err);
      border-color: var(--err)
    }

    .btn:disabled {
      opacity: .5
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px
    }

    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr
    }

    .av {
      flex: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #F2D9D2;
      color: var(--red);
      font: 700 17px var(--serif);
      border: 2px solid var(--gold)
    }

    .av.f {
      background: #EFE3C4;
      color: #7A5B1E
    }

    .av.x {
      background: #ECE8E0;
      color: var(--mute);
      border-color: var(--line)
    }

    .av.lg {
      width: 96px;
      height: 96px;
      font-size: 34px
    }

    .pc {
      display: flex;
      gap: 12px;
      align-items: center;
      text-align: left;
      width: 100%;
      cursor: pointer
    }

    .chip {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 14px;
      background: var(--tint);
      font-size: 13px;
      margin: 2px 4px 2px 0;
      border: 1px solid var(--line)
    }

    .chip.on {
      background: var(--red);
      color: #fff;
      border-color: var(--red)
    }

    .hero {
      display: grid;
      gap: 20px;
      padding: 28px 16px;
      background: linear-gradient(var(--tint), var(--bg));
      border-bottom: 1px solid var(--line)
    }

    .hero .in {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      gap: 24px;
      width: 100%
    }

    .chain {
      list-style: none;
      margin: 0;
      padding: 0 0 0 14px;
      border-left: 2px solid var(--gold)
    }

    .chain li {
      position: relative;
      padding: 4px 0 4px 16px
    }

    .chain li::before {
      content: '';
      position: absolute;
      left: -22px;
      top: 14px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--gold)
    }

    .chain li.me::before {
      background: var(--red);
      box-shadow: 0 0 0 4px #8C2F2F33
    }

    .chain b {
      font-family: var(--serif);
      font-size: 19px
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px
    }

    .stats div {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 14px
    }

    .stats b {
      font: 700 28px var(--serif);
      color: var(--red);
      display: block;
      line-height: 1.1
    }

    .tree {
      overflow: auto;
      padding: 24px 10px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      min-height: 320px;
      cursor: grab;
      touch-action: pan-x pan-y pinch-zoom
    }

    .tz {
      display: inline-flex;
      min-width: 100%;
      justify-content: center;
      transform-origin: top center;
      transition: transform .15s
    }

    .br {
      display: flex;
      flex-direction: column;
      align-items: center
    }

    .ps {
      display: flex;
      gap: 14px;
      align-items: flex-end
    }

    .ps>.br {
      position: relative;
      padding-bottom: 16px
    }

    .ps>.br::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      height: 16px;
      border-left: 2px solid var(--gold)
    }

    .ps>.br::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      border-top: 2px solid var(--gold)
    }

    .ps>.br:first-child::after {
      left: 50%
    }

    .ps>.br:last-child::after {
      right: 50%
    }

    .st {
      height: 16px;
      border-left: 2px solid var(--gold)
    }

    .nd {
      width: 116px;
      text-align: center;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 4px;
      display: block;
      font-size: 14px;
      line-height: 1.3
    }

    .nd .av {
      margin: 0 auto 4px
    }

    .nd.me {
      border: 2px solid var(--red);
      background: #FBEFEA
    }

    .nd.vr {
      border-style: dashed;
      color: var(--mute);
      background: var(--bg)
    }

    .nd small {
      display: block;
      color: var(--mute);
      font-size: 12px
    }

    .sheet {
      position: fixed;
      z-index: 30;
      background: #fff;
      box-shadow: 0 -8px 30px #0003;
      padding: 18px;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 18px 18px 0 0;
      max-height: 70vh;
      overflow: auto;
      animation: up .2s
    }

    @keyframes up {
      from {
        transform: translateY(40px);
        opacity: 0
      }
    }

    .tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
      margin: 16px 0
    }

    .tabs button {
      border: 0;
      background: none;
      padding: 10px 14px;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
      color: var(--mute)
    }

    .tabs button.on {
      color: var(--red);
      border-color: var(--red);
      font-weight: 600
    }

    dl {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 8px 12px;
      margin: 0
    }

    dt {
      color: var(--mute)
    }

    dd {
      margin: 0
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px
    }

    td,
    th {
      padding: 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top
    }

    .tw {
      overflow-x: auto
    }

    input,
    select,
    textarea {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 12px;
      background: #fff;
      width: 100%
    }

    label {
      display: block;
      font-size: 14px;
      color: var(--mute);
      margin-top: 10px
    }

    .fg {
      display: grid;
      gap: 0 12px;
      grid-template-columns: 1fr
    }

    .mask {
      position: fixed;
      inset: 0;
      background: #0006;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 12px
    }

    .modal {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      max-width: 560px;
      width: 100%;
      max-height: 90vh;
      overflow: auto
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 84px;
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 10px 18px;
      border-radius: 24px;
      z-index: 50
    }

    .empty {
      text-align: center;
      padding: 36px 12px;
      color: var(--mute)
    }

    .gen {
      display: flex;
      gap: 12px;
      align-items: center;
      width: 100%;
      text-align: left
    }

    .gen .n {
      font: 700 30px var(--serif);
      color: var(--gold);
      width: 44px
    }

    .ev {
      display: flex;
      gap: 14px;
      align-items: center
    }

    .ev .d {
      flex: none;
      width: 58px;
      text-align: center;
      background: var(--red);
      color: #fff;
      border-radius: 8px;
      padding: 4px;
      font: 700 22px/1.1 var(--serif)
    }

    .ev .d small {
      display: block;
      font: 12px var(--sans)
    }

    .ph {
      aspect-ratio: 1;
      border-radius: 10px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 8px;
      font-size: 13px;
      color: #fff
    }

    .ban {
      background: #FFF6E0;
      border: 1px solid var(--warn);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 14px
    }

    .ok {
      color: var(--ok)
    }

    .er {
      color: var(--err)
    }

    @media(min-width:768px) {
      h1 {
        font-size: 44px
      }

      h2 {
        font-size: 30px
      }

      .grid {
        grid-template-columns: 1fr 1fr
      }

      .fg {
        grid-template-columns: 1fr 1fr
      }

      .hero .in {
        grid-template-columns: 1.2fr 1fr;
        align-items: center
      }

      .stats {
        grid-template-columns: repeat(4, 1fr)
      }

      .hero {
        padding: 48px 16px
      }
    }

    @media(min-width:1024px) {
      body {
        padding-bottom: 0
      }

      nav {
        position: static;
        border: 0;
        background: none;
        max-width: 1100px;
        margin: 0 auto;
        overflow: visible
      }

      nav a {
        flex: none;
        padding: 8px 14px;
        border-top: 0;
        border-bottom: 3px solid transparent
      }

      nav a.on {
        border-bottom-color: var(--red)
      }

      nav a b {
        display: none
      }

      .grid {
        grid-template-columns: repeat(3, 1fr)
      }

      .sheet {
        left: auto;
        top: 70px;
        bottom: 0;
        width: 360px;
        border-radius: 0;
        max-height: none;
        box-shadow: -6px 0 24px #0002
      }

      .toast {
        bottom: 24px
      }

      header {
        padding-bottom: 0
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }

    body:not(.in) .sbox,
    body:not(.in) #who,
    body:not(.in) #out {
      display: none
    }

    @media(max-width:767px) {
      #who {
        display: none
      }
    }
  </style>
</head>

    function chRole(i, el) {const old = USERS[i][2], nw = el.value; el.value = old; confirmM(`Đổi vai trò của <b>${esc(USERS[i][0])}</b> từ ${old} sang ${nw}?`, async () => {const r = await sb.from('profiles').update({role: nw}).eq('id', USERS[i][4]); if (r.error) return fail(r.error); USERS[i][2] = nw; log('ROLE_CHANGE', USERS[i][0], old + ' → ' + nw); toast('Đã đổi vai trò'); render()}, 'Đổi vai trò')}
    function dlCsv() {const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([CSV_SAMPLE], {type: 'text/csv;charset=utf-8'})); a.download = 'gia-pha-mau.csv'; a.click()}
    function parseCsv(t) {const r = []; let row = [], c = '', q = 0; t = t.replace(/^\uFEFF/, ''); for (let i = 0; i < t.length; i++) {const ch = t[i]; if (q) {if (ch === '"' && t[i + 1] === '"') {c += '"'; i++} else if (ch === '"') q = 0; else c += ch} else if (ch === '"') q = 1; else if (ch === ',') {row.push(c); c = ''} else if (ch === '\n' || ch === '\r') {if (ch === '\r' && t[i + 1] === '\n') i++; row.push(c); r.push(row); row = []; c = ''} else c += ch} if (c || row.length) {row.push(c); r.push(row)} return r.filter(x => x.some(y => y.trim()))}
    function readCsv(f) {
      if (!f) return; const rd = new FileReader(); rd.onload = () => {
        const rows = parseCsv(rd.result), h = rows.shift().map(x => x.trim()), ok = [], err = [], ids = new Set(rows.map(r => r[h.indexOf('external_id')]));
        rows.forEach((r, i) => {
          const o = {}; h.forEach((k, j) => o[k] = (r[j] || '').trim()); const n = i + 2;
          if (!o.full_name) return err.push([n, 'Thiếu họ tên']);
          if (o.death_date && !/^\d{4}(-\d\d-\d\d)?$/.test(o.death_date)) return err.push([n, 'Ngày mất không hợp lệ: ' + o.death_date]);
          if (o.birth_date && !/^\d{4}(-(0[0-9]|1[0-2])-([0-2][0-9]|3[01]))?$/.test(o.birth_date)) return err.push([n, 'Ngày sinh không hợp lệ: ' + o.birth_date]);
          for (const k of ['father_external_id', 'mother_external_id']) if (o[k] && !ids.has(o[k]) && !ppl.some(p => p.ext === o[k])) return err.push([n, 'Không tìm thấy mã ' + o[k] + ' trong tệp hoặc dữ liệu']);
          ok.push(o)
        }); S.imp = {ok, err}; render()
      }; rd.readAsText(f, 'utf-8')
    }
    async function doImp() {
      const ok = S.imp.ok, rows = ok.map(o => ({name: o.full_name, g: o.gender === 'FEMALE' ? 'F' : 'M', bd: o.birth_date || null, dd: o.death_date || null, pl: o.birth_place, job: o.occupation, gen: +o.generation_number || 1, ext: o.external_id}));
      const r = await sb.from('persons').insert(rows).select(); if (r.error) return fail(r.error); const map = {}; r.data.forEach(x => map[x.ext] = x.id);
      for (const o of ok) {const f = map[o.father_external_id] || ppl.find(x => o.father_external_id && x.ext === o.father_external_id)?.id, m = map[o.mother_external_id] || ppl.find(x => o.mother_external_id && x.ext === o.mother_external_id)?.id; if (f || m) await sb.from('persons').update({f: f || null, m: m || null}).eq('id', map[o.external_id])}
      await log('IMPORT', 'CSV', `Nhập ${ok.length} dòng, lỗi ${S.imp.err.length}`); await loadAll(); toast('Đã nhập ' + ok.length + ' thành viên'); S.imp = null; S.atab = 'log'; render()
    }
    async function seedSample() {
      const rows = SEED.map(r => ({name: r[1], cn: r[2], g: r[3], bd: DATES[r[0]][0] || null, dd: DATES[r[0]][1] || null, pl: r[6], job: r[7], gen: r[8], bio: r[12], gr: r[13] || null, ext: 'S' + r[0]}));
      const r = await sb.from('persons').insert(rows).select(); if (r.error) return fail(r.error); const id = {}; r.data.forEach(x => id[x.ext] = x.id);
      for (const e of SEED) {const u = {}; if (e[9]) u.f = id['S' + e[9]]; if (e[10]) u.m = id['S' + e[10]]; if (e[11]) u.sp = id['S' + e[11]]; if (Object.keys(u).length) await sb.from('persons').update(u).eq('id', id['S' + e[0]])}
      await log('IMPORT', 'Dữ liệu mẫu', 'Nạp 18 người mẫu'); await loadAll(); S.me = id.S14 || S.me; S.center = S.me; toast('Đã nạp dữ liệu mẫu'); render()
    }
    /* ===== ĐĂNG NHẬP & TẢI DỮ LIỆU ===== */
    let sb;
    async function boot() {
      if (/XXXX|ANON_PUBLIC/.test(SUPABASE_URL + SUPABASE_KEY) || !window.supabase) return $('#app').innerHTML = '<div class="wrap"><div class="ban">Chưa cấu hình. Mở file, điền SUPABASE_URL và SUPABASE_KEY ở đầu thẻ script.</div></div>';
      sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); const {data} = await sb.auth.getSession(); data.session ? start(data.session.user) : showLogin()
    }
    function showLogin(msg = '') {$('#nav').innerHTML = ''; $('#app').innerHTML = `<div class="wrap" style="max-width:420px;padding-top:40px"><div class="card"><h2>Đăng nhập</h2><p class="mut">Gia phả chỉ dành cho thành viên đã được cấp tài khoản.</p><label for="le">Email</label><input id="le" type="email" autocomplete="username"><label for="lp">Mật khẩu</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><p id="lerr" class="er" role="alert">${msg}</p><div class="row"><button class="btn" onclick="doLogin()">Đăng nhập</button><button class="btn alt" onclick="forgot()">Quên mật khẩu</button></div></div></div>`}
    async function doLogin() {const r = await sb.auth.signInWithPassword({email: $('#le').value.trim(), password: $('#lp').value}); if (r.error) return $('#lerr').textContent = 'Email hoặc mật khẩu không đúng.'; start(r.data.user)}
    async function forgot() {const e = $('#le').value.trim(); if (!e) return $('#lerr').textContent = 'Nhập email trước.'; await sb.auth.resetPasswordForEmail(e, {redirectTo: location.origin + location.pathname}); toast('Nếu email tồn tại, liên kết đặt lại mật khẩu đã được gửi')}
    async function logout() {await sb.auth.signOut(); location.hash = ''; location.reload()}
    function newPw() {modal('<h3>Đặt mật khẩu mới</h3><label for="np">Mật khẩu (tối thiểu 8 ký tự)</label><input id="np" type="password" autocomplete="new-password"><div class="row" style="margin-top:14px"><button class="btn" onclick="setPw()">Lưu mật khẩu</button></div>')}
    async function setPw() {const p = $('#np').value; if (p.length < 8) return toast('Mật khẩu cần ít nhất 8 ký tự'); const r = await sb.auth.updateUser({password: p}); if (r.error) return fail(r.error); closeM(); toast('Đã đặt mật khẩu')}
    async function loadAll() {
      const r = await sb.from('persons').select('*').order('id').range(0, 4999); if (r.error) return fail(r.error); ppl = r.data.map(fromDb);
      if (S.role === 'ADMIN') {
        const u = await sb.from('profiles').select('*').order('email'); USERS = (u.data || []).map(x => [x.email, x.full_name || '', x.role, 'ACTIVE', x.id]); const nm = Object.fromEntries(USERS.map(x => [x[4], x[1] || x[0]]));
        const a = await sb.from('audit_log').select('*').order('at', {ascending: false}).limit(100); audit = (a.data || []).map(x => ({t: new Date(x.at).toLocaleString('vi-VN'), who: nm[x.who] || '?', act: x.act, ent: x.ent, txt: x.txt, pid: x.pid || 0}))
      } else audit = []
    }
    async function start(u) {
      const pr = await sb.from('profiles').select('*').eq('id', u.id).maybeSingle(), pf = pr.data;
      if (!pf) {$('#nav').innerHTML = ''; $('#app').innerHTML = '<div class="wrap">' + empty('Tài khoản của bạn chưa được cấp quyền. Vui lòng liên hệ quản trị viên.', '<button class="btn alt" onclick="logout()">Đăng xuất</button>') + '</div>'; return }
      S.role = pf.role; $('#who').textContent = (pf.full_name || u.email) + ' · ' + pf.role; await loadAll(); S.me = pf.person_id || live()[0]?.id || 0; S.center = S.me;
      document.body.classList.add('in'); S.ready = 1; if (!location.hash) location.hash = '#/home'; render(); if (NEEDPW) newPw()
    }
    boot();
  </script>
